# Built-in service catalog for down-check.
#
# Every entry is a status page that exposes a machine-readable endpoint.
# Fields:
#   id            unique slug (stored in your selection file)
#   name          shown in the list and the results table
#   category      grouping in `down-check list`
#   api           endpoint polled by `down-check check`
#   page          human status page, printed when something looks off
#   kind          "statuspage" (default, Atlassian schema), or one of the
#                 bespoke feeds: "aws", "gcp", "azure", "slack", "statusio"
#   reports       slug for istheservicedown.com/problems/<slug> — the crowd-
#                 sourced fallback down-check actually queries (optional)
#   downdetector  slug for downdetector.com/status/<slug>/ — printed as a link
#                 for you to open, never fetched (optional)

# ── Dev tools ────────────────────────────────────────────────────────────────
- id: github
  name: GitHub
  category: Dev tools
  api: https://www.githubstatus.com/api/v2/status.json
  page: https://www.githubstatus.com
  reports: github
  downdetector: github

- id: gitlab
  name: GitLab
  category: Dev tools
  kind: statusio
  api: https://api.status.io/1.0/status/5b36dc6502d06804c08349f7
  page: https://status.gitlab.com
  downdetector: gitlab

