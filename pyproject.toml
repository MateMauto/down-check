[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "down-check"
version = "0.4.0"
description = "A lightweight CLI that tells you whether the services you care about are down."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["cli", "status", "outage", "uptime", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.16.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "questionary>=2.1.0",
]

[project.scripts]
down-check = "down_check.cli:main"

[project.urls]
Homepage = "https://github.com/MateMauto/down-check"
Repository = "https://github.com/MateMauto/down-check"
"Bug Tracker" = "https://github.com/MateMauto/down-check/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["down_check*"]

[tool.setuptools.package-data]
down_check = ["services.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
